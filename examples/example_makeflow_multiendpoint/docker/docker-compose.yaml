x-common-image: &common-image
  image: ${RADICAL_ORBIT_IMAGE:-radicalcybertools/radical.orbit}:${RADICAL_ORBIT_TAG:-latest}

x-endpoint-service: &endpoint-service
  <<: *common-image
  environment:
    - RADICAL_ORBIT_BROKER_URL=https://${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}:8000
  command: [ "bash", "-c", "radical-orbit-endpoint-wrapper.sh -n $$(hostname) --plugins psij,rhapsody,staging" ]
  volumes:
    - radical-orbit-volume:/app:ro
  networks:
    - radical-orbit-network
  depends_on:
    image-builder:
      condition: service_completed_successfully
    broker:
      condition: service_healthy

services:

  image-builder:
    <<: *common-image
    container_name: radical-orbit-image-builder
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DOCKER_ENTRYPOINT: docker/docker-entrypoint.sh
        RADICAL_ORBIT_BRANCH: ${RADICAL_ORBIT_BRANCH:-master}
        BROKER_IP: "127.0.0.1"
        BROKER_HOSTNAME: ${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}
    command: [ "echo", "Build complete" ]
    networks:
      - radical-orbit-network

  broker:
    <<: *common-image
    container_name: radical-orbit-broker
    hostname: ${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}
    environment:
      - GENERATE_BROKER_CREDS=true
    # In production, the token value is never printed to the logs (CWE-532).
    command:
      - "bash"
      - "-c"
      - |
        echo "==============================================="
        echo "ORBIT Broker Token:"
        echo "    $(cat ~/.radical/orbit/broker.token)"
        echo "==============================================="
        exec radical-orbit-broker.py
    healthcheck:
      test:
        - CMD-SHELL
        - "timeout 1 bash -c '</dev/tcp/localhost/8000'"
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - radical-orbit-volume:/app
    networks:
      - radical-orbit-network
    depends_on:
      image-builder:
        condition: service_completed_successfully

  endpoint-a:
    <<: *endpoint-service
    container_name: radical-orbit-endpoint-a
    hostname: endpoint_a

  endpoint-b:
    <<: *endpoint-service
    container_name: radical-orbit-endpoint-b
    hostname: endpoint_b

  client:
    <<: *common-image
    container_name: radical-orbit-client
    hostname: client
    environment:
      - RADICAL_ORBIT_BROKER_URL=https://${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}:8000
    command: [ "tail", "-f", "/dev/null" ]
    volumes:
      - radical-orbit-volume:/app:ro
    networks:
      - radical-orbit-network
    depends_on:
      image-builder:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      endpoint-a:
        condition: service_started
      endpoint-b:
        condition: service_started

volumes:
  radical-orbit-volume:
    name: radical-orbit-volume

networks:
  radical-orbit-network:
    name: radical-orbit-network
