x-common-build: &common-build
  image: ${RADICAL_ORBIT_IMAGE:-radicalcybertools/radical.orbit}:${RADICAL_ORBIT_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      RADICAL_ORBIT_BRANCH: ${RADICAL_ORBIT_BRANCH:-master}

services:
  broker:
    <<: *common-build
    build:
      args:
        GENERATE_BROKER_CERT: "true"
        BROKER_IP: "127.0.0.1"
        BROKER_HOSTNAME: ${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}
    container_name: radical-orbit-broker
    hostname: ${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}
    # --no-auth: the ingress token is generated under the broker
    # container's $HOME, which the endpoint/client containers cannot
    # read — a dev demo runs with the gate off (never do this in
    # production; see DEPLOYMENT.md for token staging).
    command: [ "radical-orbit-broker.py", "--no-auth" ]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import socket; s=socket.socket(); s.settimeout(5); s.connect(("localhost", 8000)); s.close()'
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - radical-orbit-volume:/app
    networks:
      - radical-orbit-network

  endpoint:
    <<: *common-build
    build:
      args:
        GENERATE_BROKER_CERT: "false"
    container_name: radical-orbit-endpoint
    hostname: endpoint
    environment:
      - RADICAL_ORBIT_BROKER_URL=https://${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}:8000
    command: [ "radical-orbit-endpoint.py" ]
    volumes:
      - radical-orbit-volume:/app:ro
    networks:
      - radical-orbit-network
    depends_on:
      broker:
        condition: service_healthy

  client:
    <<: *common-build
    build:
      args:
        GENERATE_BROKER_CERT: "false"
    container_name: radical-orbit-client
    hostname: client
    environment:
      - RADICAL_ORBIT_BROKER_URL=https://${RADICAL_ORBIT_BROKER_HOSTNAME:-broker}:8000
    command: [ "tail", "-f", "/dev/null" ]
    volumes:
      - radical-orbit-volume:/app:ro
    networks:
      - radical-orbit-network
    depends_on:
      broker:
        condition: service_healthy
      endpoint:
        condition: service_started

volumes:
  radical-orbit-volume:
    name: radical-orbit-volume

networks:
  radical-orbit-network:
    name: radical-orbit-network
