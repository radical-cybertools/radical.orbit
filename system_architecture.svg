<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node-box   { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
      .hub-box    { fill: #e3f2fd; stroke: #1976d2; stroke-width: 3; }
      .compat-box { fill: #fff8e1; stroke: #f9a825; stroke-width: 2; }
      .info-box   { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
      .title-text { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #333; }
      .node-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #222; }
      .label-text { font-family: Arial, sans-serif; font-size: 15px; fill: #555; }
      .small-text { font-family: Arial, sans-serif; font-size: 13px; fill: #666; }
      .ws-text    { font-family: Arial, sans-serif; font-size: 13px; fill: #2e7d32; font-style: italic; }
      .http-text  { font-family: Arial, sans-serif; font-size: 13px; fill: #1976d2; font-style: italic; }
      .oob-text   { font-family: Arial, sans-serif; font-size: 13px; fill: #757575; font-style: italic; }
      .ws-line    { stroke: #4caf50; stroke-width: 3; fill: none; stroke-dasharray: 6,5; marker-end: url(#arrow-green); }
      .http-line  { stroke: #2196f3; stroke-width: 2.5; fill: none; marker-start: url(#arrow-blue-start); marker-end: url(#arrow-blue); }
      .oob-line   { stroke: #9e9e9e; stroke-width: 2; fill: none; stroke-dasharray: 3,4; marker-start: url(#arrow-grey-start); marker-end: url(#arrow-grey); }
    </style>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196f3" />
    </marker>
    <marker id="arrow-blue-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#2196f3" />
    </marker>
    <marker id="arrow-grey" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9e9e9e" />
    </marker>
    <marker id="arrow-grey-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#9e9e9e" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="42" class="title-text" text-anchor="middle">ORBIT Star Architecture</text>

  <!-- ============ BROKER HUB (center) ============ -->
  <g id="broker-hub">
    <rect x="470" y="265" width="260" height="190" class="hub-box" rx="12"/>
    <text x="600" y="300" class="node-title" text-anchor="middle" fill="#1976d2">Broker (hub)</text>
    <text x="490" y="335" class="small-text">• routing loop (routes by src / dst)</text>
    <text x="490" y="360" class="small-text">• request/response correlation</text>
    <text x="490" y="385" class="small-text">• topology + two-stage liveness</text>
    <text x="490" y="410" class="small-text">• hosted plugins (own loop/thread)</text>
    <text x="490" y="435" class="small-text">• gateway module (HTTP / SSE / UI)</text>
  </g>

  <!-- ============ PARTICIPANTS ============ -->
  <g id="endpoint-a">
    <rect x="90" y="90" width="280" height="130" class="node-box" rx="10"/>
    <text x="110" y="122" class="node-title">Endpoint</text>
    <text x="110" y="150" class="label-text">serves plugins</text>
    <text x="110" y="175" class="small-text">HPC login / compute node</text>
    <text x="110" y="198" class="small-text">psij, queue_info, staging, …</text>
  </g>

  <g id="endpoint-b">
    <rect x="90" y="500" width="280" height="140" class="node-box" rx="10"/>
    <text x="110" y="532" class="node-title">Endpoint</text>
    <text x="110" y="560" class="label-text">serves + consumes</text>
    <text x="110" y="585" class="small-text">workflow manager in an</text>
    <text x="110" y="608" class="small-text">allocation (serve and call)</text>
  </g>

  <g id="consumer">
    <rect x="830" y="90" width="280" height="130" class="node-box" rx="10"/>
    <text x="850" y="122" class="node-title">Consumer (SDK)</text>
    <text x="850" y="150" class="label-text">zero-plugin runtime</text>
    <text x="850" y="175" class="small-text">EndpointRuntime / Endpoint</text>
    <text x="850" y="198" class="small-text">get_plugin(endpoint, plugin)</text>
  </g>

  <!-- ============ COMPAT-TIER CLIENTS ============ -->
  <g id="gateway-clients">
    <rect x="830" y="500" width="280" height="140" class="compat-box" rx="10"/>
    <text x="850" y="532" class="node-title" fill="#f9a825">HTTP / SSE clients</text>
    <text x="850" y="560" class="label-text">non-participants</text>
    <text x="850" y="585" class="small-text">Explorer UI, curl, browsers</text>
    <text x="850" y="608" class="small-text">served by the gateway module</text>
  </g>

  <!-- ============ WEBSOCKET DIAL-IN (participant -> broker) ============ -->
  <line x1="360" y1="205" x2="472" y2="290" class="ws-line"/>
  <line x1="360" y1="520" x2="472" y2="432" class="ws-line"/>
  <line x1="828" y1="205" x2="728" y2="290" class="ws-line"/>
  <text x="600" y="235" class="ws-text" text-anchor="middle">single outbound WSS to /register  (firewall-friendly)</text>

  <!-- ============ HTTP / SSE (compat tier, bidirectional) ============ -->
  <line x1="828" y1="540" x2="732" y2="440" class="http-line"/>
  <text x="812" y="500" class="http-text" text-anchor="end">HTTPS / SSE (compat tier)</text>

  <!-- ============ OUT-OF-BAND BULK DATA ============ -->
  <line x1="230" y1="220" x2="230" y2="500" class="oob-line"/>
  <text x="245" y="365" class="oob-text">bulk data — out of band</text>
  <text x="245" y="385" class="oob-text">(Globus / shared FS / SSH)</text>

  <!-- ============ LEGEND ============ -->
  <g id="legend">
    <rect x="400" y="620" width="470" height="80" class="info-box" rx="8"/>
    <text x="420" y="645" class="label-text" font-weight="bold">Legend</text>
    <line x1="420" y1="663" x2="470" y2="663" class="ws-line"/>
    <text x="480" y="668" class="small-text">outbound WebSocket (participant dials the hub)</text>
    <line x1="420" y1="686" x2="470" y2="686" class="http-line"/>
    <text x="480" y="691" class="small-text">HTTP / SSE compat tier (gateway)</text>
  </g>

</svg>
