# PR gate: lint + unit tests on every pull request into devel.
#
# Deliberately minimal to stay green from day one: flake8 (config in .flake8)
# gates; pylint runs advisory (non-blocking) until the tree is clean under it.
# ruff / mypy are intentionally deferred — add them here once configs exist.
# The post-merge docker smoke test lives separately in ci-docker.yml.
name: PR checks

on:
  pull_request:
    branches: [devel]

concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # setup.py derives the version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip flake8 pylint
      - name: flake8 (gating)
        run: flake8 src/ bin/
      - name: pylint (advisory)
        run: pylint src/radical/orbit/ || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: install (runtime + dev deps)
        run: pip install -e '.[dev]'
      - name: unit tests
        run: pytest tests/unittests/ -q
