site_name: ORBIT
site_url: https://radicalorbit.readthedocs.io/en/latest/
site_author: RADICAL Cybertools
site_description: Broker-based distributed framework connecting RADICAL-Cybertools applications with HPC resources.

repo_name: radical-cybertools/radical.orbit
repo_url: https://github.com/radical-cybertools/radical.orbit

copyright: Copyright &copy; 2024—Present by <a target="_blank" href="https://radical.rutgers.edu">RADICAL Lab</a>

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - header.autohide
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: blue grey
      accent: teal
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

watch:
  - mkdocs.yml
  - docs/
  - src/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radical-cybertools/radical.orbit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: radical-cybertools
      repo: radical.orbit
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home:
      - Overview: index.md
      - Getting Started: getting_started.md
  - Runtime:
      - Architecture & Wire Protocol: architecture.md
      - Embedding the Participant Runtime: runtime_embedding.md
  - Plugins:
      - Plugin Writer's Tutorial: tutorial_plugin.md
      - Plugin Development: plugin_development.md
      - Plugin API Reference: plugin_api.md
      - Globus Plugin: plugin_globus.md
      - Queue Info Plugin: plugin_queue_info.md
      - IRI Plugins: plugin_iri.md
  - Reference:
      - REST API: rest_api.md
      - Machine Guide: machine_guide.md
      - Task Dispatcher Strategy: task_dispatcher_strategy.md
  - API Reference:
      - Modules: api/

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      enable_inventory: true
      handlers:
        python:
          paths: [src]
          options:
            annotations_path: brief
            docstring_section_style: list
            docstring_style: google
            inherited_members: yes
            line_length: 60
            members_order: source
            merge_init_into_class: yes
            separate_signature: yes
            show_object_full_path: no
            show_root_full_path: yes
            show_root_heading: no
            show_root_members_full_path: no
            show_root_toc_entry: yes
            show_signature_annotations: yes
            show_submodules: no
            show_symbol_type_heading: yes
            show_symbol_type_toc: yes
            signature_crossrefs: yes
